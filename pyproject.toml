[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "responses-api-context-experiments"
version = "0.1.0"
description = "Reproducible experiments for reasoning context, retained reasoning, response continuation, and Compaction in the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2",
    "openai",
    "openai-agents",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "nbformat",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/responses_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
